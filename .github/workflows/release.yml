name: Release

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify tested commit
        env:
          QUALITY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$QUALITY_HEAD_SHA"

      - name: Classify tested revision
        id: scope
        env:
          QUALITY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          substantive=false
          while IFS= read -r path; do
            case "$path" in
              wiki/*|scripts/graph/data/graph.json) ;;
              *) substantive=true ;;
            esac
          done < <(git diff --name-only "${QUALITY_HEAD_SHA}^1" "$QUALITY_HEAD_SHA")
          echo "substantive=$substantive" >> "$GITHUB_OUTPUT"
          if [ "$substantive" != true ]; then
            echo 'Wiki-only revisions are ineligible for release.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node
        if: steps.scope.outputs.substantive == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Enable Corepack
        if: steps.scope.outputs.substantive == 'true'
        run: corepack enable

      - name: Install pnpm
        if: steps.scope.outputs.substantive == 'true'
        run: corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store path
        if: steps.scope.outputs.substantive == 'true'
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        if: steps.scope.outputs.substantive == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Verify pnpm
        if: steps.scope.outputs.substantive == 'true'
        run: pnpm --version

      - name: Install dependencies
        if: steps.scope.outputs.substantive == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        if: steps.scope.outputs.substantive == 'true'
        run: pnpm test

      - name: Adopt wiki-only main descendants
        if: steps.scope.outputs.substantive == 'true'
        env:
          QUALITY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          latest="$(git rev-parse origin/main)"
          if [ "$latest" = "$QUALITY_HEAD_SHA" ]; then exit 0; fi
          git merge-base --is-ancestor "$QUALITY_HEAD_SHA" "$latest" || {
            echo 'main no longer descends from the tested revision.' >&2; exit 1;
          }
          while IFS= read -r path; do
            case "$path" in
              wiki/*|scripts/graph/data/graph.json) ;;
              *) echo "Untested main change blocks release: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$QUALITY_HEAD_SHA" "$latest")
          git checkout --detach "$latest"

      - name: Run semantic-release
        if: steps.scope.outputs.substantive == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
          RELEASE_NOTES_AI: ${{ vars.RELEASE_NOTES_AI }}
          RELEASE_NOTES_AI_ENDPOINT: ${{ vars.RELEASE_NOTES_AI_ENDPOINT }}
          RELEASE_NOTES_AI_MODEL: ${{ vars.RELEASE_NOTES_AI_MODEL }}
          RELEASE_NOTES_AI_DEBUG: ${{ vars.RELEASE_NOTES_AI_DEBUG }}
          RELEASE_NOTES_AI_API_KEY: ${{ secrets.RELEASE_NOTES_AI_API_KEY }}
        run: npx semantic-release
